name: Build and Push Docker Image

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate version number and lowercase repo
        id: version
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_NAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${REGISTRY}/${REPO_OWNER}/${REPO_NAME}" >> $GITHUB_OUTPUT
          
          # Версия = количество тегов + 22 (ваша начальная версия)
          VERSION=$((22 + $(git tag | wc -l)))
          echo "version=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.version.outputs.image }}:latest
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}

      - name: Save Docker image as tar
        run: |
          docker pull ${{ steps.version.outputs.image }}:latest
          docker tag ${{ steps.version.outputs.image }}:latest schedule:latest
          docker save -o schedule_${{ steps.version.outputs.version }}.tar schedule:latest
          ls -lh schedule_${{ steps.version.outputs.version }}.tar

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body: |
            ## 🐳 Docker образ Schedule
            
            ### 📥 Скачать:
            **schedule_${{ steps.version.outputs.version }}.tar** — готовый образ
            
            ### 🚀 Установка:
            ```bash
            docker load -i schedule_${{ steps.version.outputs.version }}.tar
            docker run -d --name schedule -p 5123:5123 schedule:latest