name: Build and Push Docker Image

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version number and lowercase repo
        id: version
        run: |
          # Приводим имя репозитория к lowercase
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_NAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${REGISTRY}/${REPO_OWNER}/${REPO_NAME}" >> $GITHUB_OUTPUT
          
          if [ -f VERSION ]; then
            VERSION=$(cat VERSION)
          else
            VERSION=22
          fi
          echo "version=v${VERSION}" >> $GITHUB_OUTPUT
          echo "version_num=${VERSION}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.version.outputs.image }}:latest
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}

      - name: Increment version
        run: |
          NEW_VERSION=$(( ${{ steps.version.outputs.version_num }} + 1 ))
          echo $NEW_VERSION > VERSION

      - name: Commit and push version file
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add VERSION
          git diff --staged --quiet || git commit -m "🔖 Bump version to v$(cat VERSION) [skip ci]"
          git push