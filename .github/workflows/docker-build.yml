name: Build Docker Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:  # ручной запуск

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get latest version tag
        id: version
        run: |
          # Получаем последний тег с версией, если он есть
          LATEST_TAG=$(git ls-remote --tags origin | grep -o 'v[0-9]*' | sort -V | tail -n1 || echo "v0")
          # Извлекаем номер и увеличиваем на 1
          VERSION_NUMBER=$(echo $LATEST_TAG | sed 's/v//')
          NEW_VERSION=$((VERSION_NUMBER + 1))
          echo "version=v${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "New version: v${NEW_VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: schedule:${{ steps.version.outputs.version }}
          outputs: type=docker,dest=/tmp/schedule_${{ steps.version.outputs.version }}.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: schedule_${{ steps.version.outputs.version }}
          path: /tmp/schedule_${{ steps.version.outputs.version }}.tar
          retention-days: 7

      - name: Create and push version tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.version }}
          git push origin ${{ steps.version.outputs.version }}
