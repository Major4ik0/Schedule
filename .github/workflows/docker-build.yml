name: Build and Push Docker Image

on:
  push:
    branches: [main, master]
  workflow_dispatch:  # Ручной запуск

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate version number
        id: version
        run: |
          # Берём номер из файла VERSION или начинаем с 22
          if [ -f VERSION ]; then
            VERSION=$(cat VERSION)
          else
            VERSION=22
          fi
          echo "version=v${VERSION}" >> $GITHUB_OUTPUT
          echo "version_num=${VERSION}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Increment version
        run: |
          NEW_VERSION=$(( ${{ steps.version.outputs.version_num }} + 1 ))
          echo $NEW_VERSION > VERSION

      - name: Commit and push version file
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add VERSION
          git diff --staged --quiet || git commit -m "🔖 Bump version to v$(cat VERSION) [skip ci]"
          git push