<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link href="{{url_for('static', filename='img/favicon.ico') }}" rel="shortcut icon" type="image/vnd.microsoft.icon">
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='grad' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%238b5cf6;stop-opacity:1' /%3E%3Cstop offset='100%25' style='stop-color:%236d28d9;stop-opacity:1' /%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='20' fill='url(%23grad)'/%3E%3Cpolygon points='50,25 25,42 50,55 75,42' fill='white' opacity='0.95'/%3E%3Crect x='45' y='55' width='10' height='25' rx='2' fill='white' opacity='0.95'/%3E%3Crect x='25' y='80' width='50' height='5' rx='2' fill='white' opacity='0.95'/%3E%3Ccircle cx='50' cy='30' r='3' fill='%238b5cf6'/%3E%3C/svg%3E">

    <title>{% block title %}Аргус{% endblock %}</title>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <section class="layers">
		<div class="layers__container">
			<div class="layers__item layer-1" style="background-image: url('{{url_for('static', filename='img/layer-1.jpg') }}');" id="layersT"></div>
			<div class="layers__item layer-2" style="background-image: url('{{url_for('static', filename='img/layer-2.png') }}' );"></div>
			<div class="layers__item layer-3">
				{% block content %}{% endblock %}
			</div>
			<div class="layers__item layer-4">
				<canvas class="rain"></canvas>
			</div>
			<div class="layers__item layer-5" style="background-image: url('{{url_for('static', filename='img/layer-5.png') }}' );"></div>

		</div>

	</section>


</body>
{% block extra_js %}{% endblock %}
</html>
